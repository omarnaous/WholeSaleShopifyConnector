<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- App Bridge reads the client id from this tag. Replaced at build time from VITE_SHOPIFY_API_KEY. -->
    <meta name="shopify-api-key" content="%VITE_SHOPIFY_API_KEY%" />
    <!-- Must be loaded from Shopify's CDN (not bundled), before any other script, for App Store review. -->
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
    <title>Lumen Wholesale</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
